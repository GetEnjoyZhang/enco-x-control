name: EncoXControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  EncoXControl:
    type: application
    platform: iOS
    sources:
      - path: EncoXControl
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.encoxcontrol
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: EncoXControl/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
